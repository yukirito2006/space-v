<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPACE V — Aesthetic &amp; Wellness Clinic</title>
<meta name="description" content="SPACE V คลินิกความงามและเวลเนส ที่ให้ความไว้วางใจมาก่อนความงาม">
<meta property="og:title" content="SPACE V — Aesthetic & Wellness Clinic">
<meta property="og:description" content="Trust Comes First. Beauty Follows.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1f5fd1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f5fd1'/%3E%3Cpath d='M14 20l18 30L52 12' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --radius:.625rem;
  --gold:oklch(.72 .09 75);
  --hero-fg:oklch(.99 .006 85);
  --ice-fg:oklch(.99 .005 240);
  --ice-primary:oklch(.48 .18 252);
  --background:oklch(.975 .012 85);
  --foreground:oklch(.24 .02 60);
  --card:#fff;
  --primary:oklch(.208 .042 265.755);
  --primary-fg:oklch(.984 .003 247.858);
  --secondary:oklch(.968 .007 247.896);
  --muted-fg:oklch(.554 .046 257.417);
  --destructive:oklch(.577 .245 27.325);
  --border:oklch(.929 .013 255.508);
  --shadow-ice:0 18px 40px -18px oklch(.55 .19 254 / .65);
  --font-display:"Cormorant Garamond","Noto Serif Thai",Georgia,serif;
  --font-sans:"Noto Sans Thai","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;border-color:var(--border)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
img{display:block;max-width:100%}
h1,h2,h3,h4,p,ul,figure{margin:0;padding:0}
ul{list-style:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice-primary);outline-offset:2px}
.font-display{font-family:var(--font-display);font-weight:500}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted-fg)}
.center{text-align:center}
.hidden{display:none!important}

/* ---------- header ---------- */
.hdr{position:relative;z-index:20;display:flex;height:80px;align-items:center;justify-content:space-between;padding:0 20px;background:oklch(.975 .012 85 / .95);color:var(--foreground)}
@media(min-width:768px){.hdr{padding:0 40px}}
.hdr.icy{background:none;color:var(--ice-fg)}
.hdr-r{display:flex;align-items:center;gap:8px}
@media(min-width:640px){.hdr-r{gap:16px}}
.logo-link{display:block;flex:none}
.logo{height:40px;width:auto;color:var(--ice-primary)}
.hdr.icy .logo{color:#fff}
.pill-member{display:none;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:500}
@media(min-width:640px){.pill-member{display:flex}}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;transition:background .2s}
.icon-btn:hover{background:var(--secondary)}
.hdr.icy .icon-btn:hover{background:oklch(1 0 0 / .18)}
.icon-btn .ico{width:22px;height:22px}

/* ---------- home ---------- */
.page{min-height:100vh;background:var(--background)}
.page.has-nav{padding-bottom:80px}
@media(min-width:768px){.page.has-nav{padding-bottom:0}}
.hero{position:relative;isolation:isolate;margin:0 auto;min-height:610px;max-width:1600px;overflow:hidden}
@media(min-width:768px){.hero{min-height:720px}}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% center}
.hero-ov{position:absolute;inset:0;background-image:linear-gradient(90deg,oklch(.24 .03 60 / .72) 0%,oklch(.24 .03 60 / .35) 55%,transparent 100%)}
.hero-in{position:relative;z-index:10;display:flex;min-height:610px;max-width:80rem;align-items:flex-end;padding:0 24px 56px}
@media(min-width:768px){.hero-in{min-height:720px;align-items:center;padding:0 48px}}
@media(min-width:1024px){.hero-in{padding:0 80px}}
.hero-txt{max-width:36rem;color:var(--hero-fg)}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase}
.hero h1{margin-top:16px;font-size:48px;line-height:.96}
@media(min-width:768px){.hero h1{font-size:72px}}
.hero-sub{margin-top:24px;max-width:24rem;white-space:pre-line;font-size:16px;line-height:1.7}
@media(min-width:768px){.hero-sub{font-size:18px}}
.btn-ghost-light{margin-top:28px;display:inline-flex;align-items:center;gap:12px;border:1px solid oklch(.99 .006 85 / .7);border-radius:999px;padding:12px 24px;font-size:14px;transition:background .2s,color .2s}
.btn-ghost-light:hover{background:var(--hero-fg);color:var(--foreground)}
.btn-ghost-light .ico{width:16px;height:16px}
.hero-count{position:absolute;z-index:11;bottom:28px;right:24px;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.25em;color:oklch(.99 .006 85 / .85)}
@media(min-width:768px){.hero-count{right:48px}}
.hero-count button{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid oklch(.99 .006 85 / .5)}
.hero-count button:hover{background:oklch(1 0 0 / .18)}
.hero-count .ico{width:14px;height:14px}

.shortcuts{margin:0 auto;display:grid;max-width:72rem;grid-template-columns:repeat(2,1fr);border-bottom:1px solid var(--border);padding:28px 16px}
@media(min-width:768px){.shortcuts{grid-template-columns:repeat(4,1fr);padding:28px 32px}}
.sc{display:flex;min-width:0;flex-direction:column;align-items:center;padding:12px 8px;text-align:center}
.sc:nth-child(even){border-left:1px solid var(--border)}
@media(min-width:768px){.sc{border-left:1px solid var(--border)}.sc:first-child{border-left:0}}
.sc-ic{margin-bottom:12px;display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:var(--secondary);transition:background .2s,color .2s}
.sc:hover .sc-ic{background:var(--primary);color:var(--primary-fg)}
.sc strong{font-size:14px;font-weight:500}
.sc span.sub{margin-top:4px;font-size:12px;color:var(--muted-fg)}

.sec{margin:0 auto;max-width:72rem;padding:40px 20px}
@media(min-width:768px){.sec{padding:64px 32px}}
.camp-card{position:relative;display:block;min-height:390px;overflow:hidden;border-radius:var(--radius)}
@media(min-width:768px){.camp-card{min-height:520px}}
.camp-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s}
.camp-card:hover>img{transform:scale(1.02)}
.camp-ov{position:absolute;inset:0;background-image:linear-gradient(180deg,oklch(.4 .09 245 / .25) 0%,oklch(.25 .1 250 / .72) 100%)}
.camp-in{position:relative;display:flex;min-height:390px;flex-direction:column;justify-content:flex-end;padding:24px;color:var(--ice-fg)}
@media(min-width:768px){.camp-in{min-height:520px;padding:48px}}
.camp-in .eyebrow{letter-spacing:.24em}
.camp-in h2{margin-top:12px;font-size:48px;line-height:1.1}
@media(min-width:768px){.camp-in h2{font-size:72px}}
.camp-in p.sub{margin-top:12px;max-width:28rem;font-size:14px}
@media(min-width:768px){.camp-in p.sub{font-size:16px}}
.camp-btn{margin-top:24px;display:inline-flex;width:fit-content;align-items:center;border:1px solid oklch(.99 .005 240 / .7);border-radius:999px;padding:12px 24px;font-size:14px}

.member-sec{border-top:1px solid var(--border);background:oklch(.968 .007 247.896 / .5)}
.member-in{margin:0 auto;max-width:72rem;padding:56px 20px}
@media(min-width:768px){.member-in{padding:80px 32px}}
.member-head{display:grid;align-items:end;gap:20px}
@media(min-width:768px){.member-head{grid-template-columns:1fr auto}}
.member-head .tiny{font-size:12px;letter-spacing:.25em;color:var(--muted-fg)}
.member-head h2{margin-top:8px;font-size:36px}
@media(min-width:768px){.member-head h2{font-size:48px}}
.member-head p.s{margin-top:8px}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.link-arrow .ico{width:16px;height:16px}
.tiers{margin-top:32px;display:grid;gap:16px}
@media(min-width:640px){.tiers{grid-template-columns:repeat(2,1fr)}}
.tier{min-height:192px;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.tier.warm{background-image:linear-gradient(135deg,oklch(.94 .035 75) 0%,oklch(.88 .06 70) 100%)}
.tier.cool{background-image:linear-gradient(135deg,oklch(.94 .02 240) 0%,oklch(.88 .05 245) 100%)}
.tier .t{font-size:24px}
.tier .s{margin-top:8px;font-size:14px;color:var(--muted-fg)}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--border);background:oklch(.975 .012 85 / .95);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}
@media(min-width:768px){.bnav{display:none}}
.bnav-in{margin:0 auto;display:grid;max-width:32rem;grid-template-columns:repeat(5,1fr)}
.bnav a{display:flex;height:64px;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--muted-fg)}
.bnav a.on{color:var(--gold)}

/* ---------- campaign landing ---------- */
.shell{min-height:100vh;background-color:oklch(.97 .012 240);color:var(--foreground)}
.camp-page{position:relative;min-height:100vh;overflow:hidden;color:var(--ice-fg);background-color:oklch(.97 .012 240)}
.camp-page .hdr-wrap{position:absolute;left:0;right:0;top:0;z-index:20}
.camp-sec{position:relative;isolation:isolate;min-height:100vh}
.camp-sec>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.winter-ov{position:absolute;inset:0;background-image:linear-gradient(180deg,oklch(.55 .12 240 / .35) 0%,oklch(.2 .1 255 / .78) 100%)}
.camp-body{position:relative;z-index:10;margin:0 auto;display:flex;min-height:100vh;max-width:72rem;flex-direction:column;align-items:center;justify-content:flex-end;padding:112px 20px 64px;text-align:center}
@media(min-width:768px){.camp-body{justify-content:center}}
.camp-body .snow{width:32px;height:32px;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
.camp-body .eyebrow{letter-spacing:.3em}
.camp-body h1{margin-top:16px;font-size:60px;line-height:1}
@media(min-width:768px){.camp-body h1{font-size:96px}}
.camp-body p.sub{margin-top:20px;max-width:32rem;font-size:16px;color:oklch(.99 .005 240 / .9)}
@media(min-width:768px){.camp-body p.sub{font-size:18px}}
.btn-white{margin-top:32px;display:inline-flex;min-height:56px;min-width:224px;align-items:center;justify-content:center;gap:12px;border-radius:999px;background:var(--ice-fg);padding:0 32px;font-size:16px;font-weight:600;color:var(--ice-primary);box-shadow:var(--shadow-ice);transition:transform .2s}
.btn-white:hover{transform:scale(1.02)}
.btn-white .ico{width:20px;height:20px}
@keyframes pulse{50%{opacity:.5}}

/* ---------- scan ---------- */
.scan-wrap{margin:0 auto;max-width:42rem;padding:0 20px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.back .ico{width:16px;height:16px}
.back.ice{color:var(--ice-primary)}
.prog{margin:24px auto 0;display:flex;max-width:20rem;align-items:center;gap:8px}
.prog i{height:6px;flex:1;border-radius:999px;background:oklch(.48 .18 252 / .2)}
.prog i.on{background:var(--ice-primary)}
.prog b{margin-left:8px;font-size:12px;font-weight:500;color:var(--ice-primary)}
.scan-sec{margin-top:40px}
.scan-sec h1,.scan-sec h2.big{font-size:36px;line-height:1.15}
@media(min-width:768px){.scan-sec h1,.scan-sec h2.big{font-size:48px}}
.scan-sec .intro{margin-top:12px;font-size:14px;color:var(--muted-fg)}
@media(min-width:768px){.scan-sec .intro{font-size:16px}}
.up-card{margin-top:32px;border:1px solid oklch(.48 .18 252 / .25);border-radius:16px;background:oklch(.975 .012 85 / .7);padding:24px;box-shadow:var(--shadow-ice)}
.up-card .ttl{font-weight:500}
.up-card .help{margin-top:8px;font-size:14px;color:var(--muted-fg)}
.up-btns{margin-top:24px;display:grid;gap:12px}
@media(min-width:640px){.up-btns{grid-template-columns:repeat(2,1fr)}}
.btn-ice{display:inline-flex;min-height:56px;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:var(--ice-primary);padding:0 24px;font-size:14px;font-weight:600;color:var(--ice-fg)}
.btn-ice:disabled{opacity:.4}
.btn-ice-o{display:inline-flex;min-height:56px;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid oklch(.48 .18 252 / .4);padding:0 24px;font-size:14px;font-weight:600;color:var(--ice-primary)}
.btn-ice .ico,.btn-ice-o .ico{width:20px;height:20px}
.privacy{margin-top:20px;font-size:12px;color:var(--muted-fg)}
.scanbox{position:relative;margin:0 auto;aspect-ratio:1;width:224px;overflow:hidden;border:2px solid oklch(.48 .18 252 / .4);border-radius:16px;background:var(--secondary);box-shadow:var(--shadow-ice)}
.scanbox img{width:100%;height:100%;object-fit:cover}
.scan-line{position:absolute;left:0;right:0;height:2px;background-image:linear-gradient(90deg,transparent,var(--ice-primary) 20%,var(--ice-fg) 50%,var(--ice-primary) 80%,transparent);box-shadow:0 0 12px 2px oklch(.55 .19 254 / .7);animation:scan-sweep 2.1s ease-in-out infinite}
@keyframes scan-sweep{0%{top:4%;opacity:0}8%{opacity:1}50%{top:96%;opacity:1}58%{opacity:0}100%{top:4%;opacity:0}}
.corner{position:absolute;width:22px;height:22px;border-color:var(--ice-primary);border-style:solid;border-width:0}
.corner.tl{top:8px;left:8px;border-left-width:2px;border-top-width:2px;border-top-left-radius:8px}
.corner.tr{top:8px;right:8px;border-right-width:2px;border-top-width:2px;border-top-right-radius:8px}
.corner.bl{bottom:8px;left:8px;border-left-width:2px;border-bottom-width:2px;border-bottom-left-radius:8px}
.corner.br{bottom:8px;right:8px;border-right-width:2px;border-bottom-width:2px;border-bottom-right-radius:8px}
.status{margin-top:24px;font-size:14px;font-weight:500;color:var(--ice-primary);animation:pulse 2s ease-in-out infinite}
.concerns{margin-top:28px;display:grid;gap:12px}
@media(min-width:640px){.concerns{grid-template-columns:repeat(2,1fr)}}
.concern{border:1px solid oklch(.48 .18 252 / .25);border-radius:16px;background:oklch(.975 .012 85 / .7);padding:20px;transition:border-color .2s,background .2s}
.concern:hover{border-color:var(--ice-primary)}
.concern.on{border-color:var(--ice-primary);background:oklch(.48 .18 252 / .1);box-shadow:var(--shadow-ice)}
.concern .row{display:flex;align-items:center;justify-content:space-between}
.concern .row p{font-weight:500}
.concern .dot{display:grid;place-items:center;width:20px;height:20px;border-radius:999px;border:1px solid oklch(.554 .046 257.417 / .4)}
.concern.on .dot{border-color:var(--ice-primary);background:var(--ice-primary);color:var(--ice-fg)}
.concern .dot .ico{width:14px;height:14px}
.concern .d{margin-top:4px;font-size:14px;color:var(--muted-fg)}
.go{margin-top:28px;width:100%}
.ba{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ba figure{text-align:center}
.ba .fr{position:relative;margin:0 auto;aspect-ratio:1;width:100%;overflow:hidden;border:2px solid oklch(.48 .18 252 / .25);border-radius:16px}
.ba .fr.after{border-color:var(--ice-primary);box-shadow:var(--shadow-ice)}
.ba img{width:100%;height:100%;object-fit:cover}
.ba figcaption{margin-top:8px;font-size:12px;letter-spacing:.15em;color:var(--muted-fg)}
.ba .after+figcaption{color:var(--ice-primary)}
.ba .nophoto{display:grid;height:100%;place-items:center;background:var(--secondary);font-size:12px;color:var(--muted-fg)}
.recs{margin-top:32px;display:grid;gap:12px}
@media(min-width:640px){.recs{grid-template-columns:repeat(2,1fr)}}
.rec{display:flex;gap:12px;border:1px solid oklch(.48 .18 252 / .18);border-radius:16px;background:oklch(1 0 0 / .6);backdrop-filter:blur(16px);padding:16px}
.rec .ic{display:grid;flex:none;place-items:center;width:40px;height:40px;border-radius:999px;background:oklch(.48 .18 252 / .1);color:var(--ice-primary)}
.rec p.n{font-weight:500}
.rec p.d{margin-top:4px;font-size:14px;color:var(--muted-fg)}
.consult{margin-top:32px;border-radius:16px;background:var(--ice-primary);padding:24px;text-align:center;color:var(--ice-fg);box-shadow:var(--shadow-ice)}
.consult .badge{display:inline-flex;border-radius:999px;background:oklch(.99 .005 240 / .2);padding:4px 12px;font-size:12px;font-weight:500}
.consult .h{margin-top:12px;font-size:24px;line-height:1.25}
@media(min-width:768px){.consult .h{font-size:30px}}
.consult .btn-white{margin-top:20px;min-width:0;min-height:56px;font-size:14px}
.acts{margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.acts button{display:inline-flex;min-height:48px;align-items:center;gap:8px;border-radius:999px;padding:0 24px;font-size:14px;border:1px solid var(--border)}
.acts button.ice{border-color:oklch(.48 .18 252 / .4);color:var(--ice-primary)}
.acts .ico{width:16px;height:16px}
.disc{margin-top:24px;text-align:center;font-size:12px;line-height:1.7;color:var(--muted-fg)}

/* ---------- content pages ---------- */
.narrow{margin:0 auto;max-width:48rem;padding:24px 20px}
.narrow.w2{max-width:42rem}
.narrow.w4{max-width:56rem}
.narrow.w3{max-width:48rem}
.narrow.wm{max-width:28rem}
.h-title{margin-top:8px;font-size:48px;line-height:1.1}
.cards2{margin-top:40px;display:grid;gap:16px}
@media(min-width:640px){.cards2{grid-template-columns:repeat(2,1fr)}}
.bcard{border:1px solid var(--border);border-radius:16px;padding:24px}
.bic{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:var(--secondary);color:var(--gold)}
.bcard h2{margin-top:16px;font-size:20px}
.bcard p{margin-top:4px;font-size:14px;color:var(--muted-fg)}
.ice-cta{margin-top:40px;border-radius:16px;background:var(--ice-primary);padding:28px;text-align:center;color:var(--ice-fg)}
.ice-cta .f{font-size:24px}
.ice-cta p.s{margin-top:8px;font-size:14px;color:oklch(.99 .005 240 / .85)}
.ice-cta .btn-white{margin-top:20px;min-width:0;min-height:0;padding:12px 24px;font-size:14px;gap:8px;box-shadow:none}
.ice-cta .btn-white .ico{width:16px;height:16px}
.pts-hero{margin-top:32px;border-radius:16px;background:var(--ice-primary);padding:24px;text-align:center;color:var(--ice-fg)}
.pts-hero .l{font-size:12px;letter-spacing:.1em}
.pts-hero .n{margin-top:4px;font-size:36px}
.pts-hero a{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:14px;text-decoration:underline}
.pts-hero a .ico{width:16px;height:16px}
.pts-join{margin-top:32px;border:1px dashed var(--border);border-radius:16px;padding:24px;text-align:center}
.pts-join p{font-size:14px;color:var(--muted-fg)}
.btn-dark{margin-top:16px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--primary);padding:12px 24px;font-size:14px;font-weight:600;color:var(--primary-fg)}
.btn-dark .ico{width:16px;height:16px}
.way{border:1px solid var(--border);border-radius:16px;padding:20px}
.way .top{display:flex;align-items:center;justify-content:space-between}
.way .b{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:var(--secondary);color:var(--gold)}
.way .pt{font-size:14px;font-weight:600;color:var(--gold)}
.way p.t{margin-top:12px;font-weight:500}
.way p.d{margin-top:4px;font-size:14px;color:var(--muted-fg)}

/* ---------- member ---------- */
.shell-c{min-height:100vh;background:oklch(.97 .012 240);color:var(--foreground)}
.join-box{margin-top:32px;border:1px solid oklch(.48 .18 252 / .25);border-radius:16px;background:oklch(.975 .012 85 / .7);padding:24px;box-shadow:var(--shadow-ice)}
.seg{margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;border-radius:999px;background:var(--secondary);padding:4px;font-size:14px;font-weight:500}
.seg button{border-radius:999px;padding:8px 0;text-align:center;color:var(--muted-fg);transition:background .2s}
.seg button.on{background:var(--ice-primary);color:var(--ice-fg)}
.form{display:grid;gap:12px}
.inp{height:48px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:0 16px;font-size:14px}
.err{font-size:14px;color:var(--destructive)}
.btn-full{margin-top:4px;display:inline-flex;height:48px;width:100%;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:var(--ice-primary);font-size:14px;font-weight:600;color:var(--ice-fg)}
.btn-full .ico{width:16px;height:16px}
.welcome{display:grid;min-height:100vh;place-items:center;padding:0 20px;text-align:center}
.welcome .btn-ice{margin-top:32px;height:56px}
.ttl-sm{font-size:12px;letter-spacing:.3em;color:var(--ice-primary)}
.dash-top{display:flex;align-items:center;justify-content:space-between}
.dash-top .tiny{font-size:12px;letter-spacing:.25em;color:var(--muted-fg)}
.dash-top h1{margin-top:4px;font-size:30px}
@media(min-width:768px){.dash-top h1{font-size:36px}}
.avatar-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:var(--secondary)}
.tier-card{margin-top:24px;border-radius:16px;background:var(--ice-primary);padding:24px;color:var(--ice-fg);box-shadow:var(--shadow-ice)}
.tier-card .r{display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.1em}
.tier-card .n{margin-top:8px;font-size:36px}
.bar{margin-top:16px;height:8px;width:100%;overflow:hidden;border-radius:999px;background:oklch(.99 .005 240 / .25)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--ice-fg);transition:width .4s}
.tier-card .m{margin-top:12px;font-size:12px;color:oklch(.99 .005 240 / .85)}
.quick{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:16px;text-align:center}
.quick a .ico{color:var(--ice-primary)}
.quick a span{font-size:12px;font-weight:500}
.blk{margin-top:32px}
.blk .hd{display:flex;align-items:center;justify-content:space-between}
.blk h2{font-size:24px}
.blk .hd a{font-size:14px;color:var(--muted-fg)}
.hub-link{margin-top:12px;display:block;border:1px solid var(--border);border-radius:16px;background:oklch(.968 .007 247.896 / .4);padding:20px;font-size:14px;color:var(--muted-fg)}
.tiers-box{margin-top:32px;border:1px solid var(--border);border-radius:16px;padding:20px}
.tiers-box .h{font-size:14px;font-weight:500}
.tiers-box .g{margin-top:12px;display:grid;gap:8px}
@media(min-width:640px){.tiers-box .g{grid-template-columns:repeat(3,1fr)}}
.tiers-box .g div{border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px}
.tiers-box .g div.on{border-color:var(--gold);background:var(--secondary)}
.tiers-box .g b{font-weight:500}
.tiers-box .g span{display:block;margin-top:4px;font-size:12px;color:var(--muted-fg)}
.pg-title{margin-top:24px;font-size:36px}
.pg-sub{margin-top:8px;font-size:14px;color:var(--muted-fg)}
.chips{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--muted-fg)}
.chip.on{border-color:var(--primary);background:var(--primary);color:var(--primary-fg)}
.rw-head{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.rw-head h1{font-size:36px}
.rw-head p{font-size:14px;color:var(--muted-fg)}
.rw-head p b{font-weight:600;color:var(--foreground)}
.rewards{margin-top:24px;display:grid;gap:16px}
@media(min-width:640px){.rewards{grid-template-columns:repeat(2,1fr)}}
.rw{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:20px}
.rw .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rw .top p.n{font-weight:500}
.rw .top p.d{margin-top:4px;font-size:14px;color:var(--muted-fg)}
.rw .bd{flex:none;border-radius:999px;background:var(--secondary);padding:4px 10px;font-size:10px;font-weight:500;color:var(--gold)}
.rw .bot{margin-top:16px;display:flex;align-items:flex-end;justify-content:space-between}
.rw .old{font-size:12px;color:var(--muted-fg);text-decoration:line-through}
.rw .pr{font-size:20px}
.rw .redeem{display:inline-flex;height:40px;align-items:center;border-radius:999px;background:var(--primary);padding:0 20px;font-size:12px;font-weight:600;color:var(--primary-fg)}
.rw .redeem:disabled{opacity:.4}
.note-box{margin-top:32px;display:flex;align-items:center;gap:12px;border:1px dashed var(--border);border-radius:16px;padding:20px;font-size:14px;color:var(--muted-fg)}
.note-box .ico{color:var(--gold)}
.ledger{margin-top:24px;border:1px solid var(--border);border-radius:16px}
.ledger>div{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--border)}
.ledger>div:first-child{border-top:0}
.ledger .l{font-size:14px;font-weight:500}
.ledger .dt{margin-top:4px;font-size:12px;color:var(--muted-fg)}
.ledger .p{font-size:14px;font-weight:600}
.ledger .p.plus{color:var(--gold)}
.ledger .p.minus{color:var(--muted-fg)}
.vids{margin-top:24px;display:grid;gap:16px}
@media(min-width:640px){.vids{grid-template-columns:repeat(2,1fr)}}
.vid{display:block;text-align:left}
.thumb{position:relative;display:flex;aspect-ratio:16/9;align-items:center;justify-content:center;border-radius:16px;background:var(--secondary)}
.thumb .ico{width:40px;height:40px;color:var(--gold);transition:transform .2s,opacity .2s}
.thumb .ico.on{transform:scale(.9);opacity:.6}
.thumb .dur{position:absolute;right:8px;bottom:8px;border-radius:4px;background:oklch(.24 .02 60 / .8);padding:2px 6px;font-size:10px;color:var(--background)}
.thumb .cat{position:absolute;left:8px;top:8px;border-radius:999px;background:oklch(.975 .012 85 / .8);padding:2px 8px;font-size:10px;font-weight:500}
.vid p.t{margin-top:8px;font-size:14px;font-weight:500}
.vid p.d{margin-top:4px;font-size:12px;color:var(--muted-fg)}
.vid p.pl{margin-top:4px;font-size:12px;color:var(--ice-primary)}
.prof-top{margin-top:24px;display:flex;align-items:center;gap:16px}
.prof-top .av{display:grid;place-items:center;width:64px;height:64px;border-radius:999px;background:var(--secondary);color:var(--gold)}
.prof-top .av .ico{width:28px;height:28px}
.prof-top .nm{font-size:24px}
.prof-top .ph{font-size:14px;color:var(--muted-fg)}
.menu-list{margin-top:32px;border:1px solid var(--border);border-radius:16px}
.menu-list>*{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--border)}
.menu-list>*:first-child{border-top:0}
.menu-list span{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500}
.menu-list .ico{width:16px;height:16px;color:var(--muted-fg)}
.signout{margin-top:24px;display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:12px 0;font-size:14px;font-weight:500;color:var(--destructive)}
.signout .ico{width:16px;height:16px}

/* ---------- drawer / toast / preview ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:oklch(.2 .02 60 / .45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:71;display:flex;width:min(360px,88vw);flex-direction:column;background:var(--background);padding:20px;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.drawer-top{display:flex;align-items:center;justify-content:space-between}
.drawer-top .t{font-size:24px}
.search{margin-top:20px;display:flex;height:48px;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;background:var(--card);padding:0 16px}
.search input{flex:1;min-width:0;border:0;background:none;font-size:14px;outline:none}
.search .ico{width:18px;height:18px;color:var(--muted-fg)}
.dnav{margin-top:12px;flex:1;overflow:auto}
.dnav a{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:16px 4px;font-size:16px}
.dnav a small{font-size:12px;color:var(--muted-fg)}
.dnav .empty{padding:16px 4px;font-size:14px;color:var(--muted-fg)}
.drawer .adm-link{margin-top:12px;font-size:12px;color:var(--muted-fg);text-decoration:underline}
.toast{position:fixed;left:50%;bottom:88px;z-index:90;max-width:min(92vw,420px);transform:translate(-50%,16px);border-radius:999px;background:var(--primary);padding:12px 20px;font-size:14px;color:var(--primary-fg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prev-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--ice-primary);padding:8px 16px;font-size:13px;color:var(--ice-fg)}
.prev-bar button{border:1px solid oklch(.99 .005 240 / .6);border-radius:999px;padding:4px 14px;font-size:12px}
.prev-bar button:hover{background:oklch(1 0 0 / .18)}

/* ---------- admin ---------- */
.adm{min-height:100vh;background:var(--background);padding:32px 20px}
.adm-in{margin:0 auto;max-width:64rem}
.adm h1{margin-top:16px;font-size:36px}
.adm .local{margin-top:12px;border:1px solid var(--border);border-radius:12px;background:oklch(.968 .007 247.896 / .6);padding:12px 16px;font-size:13px;color:var(--muted-fg)}
.adm .who{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.adm .who .inp{height:40px;width:220px}
.adm .tabs{margin-top:24px;display:flex;gap:8px}
.adm .tabs button{height:40px;border:1px solid var(--border);border-radius:999px;padding:0 20px;font-size:14px}
.adm .tabs button.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.adm textarea{margin-top:20px;height:460px;width:100%;resize:vertical;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6}
.adm .btns{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px}
.adm .btns button{display:inline-flex;height:48px;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:0 24px;font-size:14px}
.adm .btns button.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:600}
.adm .btns button:disabled{opacity:.4}
.adm .btns .ico{width:16px;height:16px}
.adm .msg{margin-top:12px;font-size:14px;color:var(--muted-fg)}
.adm .hist{margin-top:40px}
.adm .hist h2{font-size:24px}
.adm .hist ul{margin-top:12px;border:1px solid var(--border);border-radius:8px}
.adm .hist li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:14px;border-top:1px solid var(--border)}
.adm .hist li:first-child{border-top:0}
.adm .hist li span:last-child{color:var(--muted-fg);text-align:right}
.err-card{margin:80px auto;max-width:28rem;padding:0 20px;text-align:center}
.err-card h1{font-size:30px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

</style>
</head>

<div id="app"></div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="เมนู"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function img(src) {
  src = String(src || '');
  if (src.indexOf('asset:') === 0) return ASSETS[src.slice(6)] || '';
  if (src.indexOf('hero-editorial') > -1) return ASSETS.hero;
  if (src.indexOf('campaign-winter') > -1) return ASSETS.campaign;
  if (src.indexOf('result-face') > -1) return ASSETS.result;
  return src;
}

function tierForPoints(points) {
  const sorted = TIERS.slice().sort((a, b) => a.threshold - b.threshold);
  let current = sorted[0];
  sorted.forEach(t => { if (points >= t.threshold) current = t; });
  const next = sorted.find(t => t.threshold > current.threshold) || null;
  const progress = next ? Math.min(100, Math.round(((points - current.threshold) / (next.threshold - current.threshold)) * 100)) : 100;
  return { current, next, progress };
}

/* ================= storage (localStorage with in-memory fallback) ================= */
const mem = {};
const store = {
  get(k) { try { const v = window.localStorage.getItem(k); return v === null && k in mem ? mem[k] : v; } catch (e) { return k in mem ? mem[k] : null; } },
  set(k, v) { mem[k] = v; try { window.localStorage.setItem(k, v); } catch (e) { /* memory only */ } },
  del(k) { delete mem[k]; try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};

/* ================= CMS (draft / publish / history) ================= */
function loadCms() {
  try {
    const raw = store.get('sv_cms_v1');
    if (raw) { const o = JSON.parse(raw); return { published: o.published || {}, draft: o.draft || {}, history: o.history || [] }; }
  } catch (e) { /* fall through */ }
  return { published: {}, draft: {}, history: [] };
}
const CMS = loadCms();

const SESSION_KEY = 'sv_close_friends_session';
function readSession() { try { const r = store.get(SESSION_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function writeSession(s) { if (s) store.set(SESSION_KEY, JSON.stringify(s)); else store.del(SESSION_KEY); }
function joinOrSignIn(phone, name) {
  const ex = readSession();
  if (ex && ex.phone === phone) return ex;
  const s = { phone: phone, name: (name || '').trim() || 'Close Friend', points: 1450, joinedAt: new Date().toISOString(), hasSeenWelcome: false };
  writeSession(s); return s;
}

function linkAttrs(link) {
  link = String(link || '').trim();
  if (link.charAt(0) === '/') return 'href="#' + esc(link) + '"';
  if (/^(https?:|line:|tel:|mailto:)/i.test(link)) return 'href="' + esc(link) + '" target="_blank" rel="noopener noreferrer"';
  return 'href="#" data-act="anchor" data-anchor="' + esc(link) + '"';

  '/member': { v: member, t: 'Close Friends — SPACE V' },
  '/member/profile': { v: mProfile, t: 'โปรไฟล์ — SPACE V' },
  '/member/history': { v: mHistory, t: 'ประวัติแต้ม — SPACE V' },
  '/member/rewards': { v: mRewards, t: 'Rewards Catalog — SPACE V' },
  '/member/content': { v: mContent, t: 'Exclusive Content — SPACE V' },
  '/admin': { v: admin, t: 'จัดการเนื้อหา — SPACE V' }
};
let lastPath = null;
function currentPath() { const h = location.hash.replace(/^#/, ''); return ROUTES[h] ? h : '/'; }
function resetScan() { clearInterval(S.timer); S.step = 1; S.photo = null; S.concerns = []; S.analyzing = false; S.statusIndex = 0; }
function render(opts) {
  const path = currentPath();
  const changed = path !== lastPath;
  if (changed) {
    clearInterval(S.timer); S.analyzing = false; toggleDrawer(false);
    if (path === '/scan') resetScan();
    if (path === '/admin') S.adminText = null;
  }
  const r = ROUTES[path]; let html;
  try { html = r.v(path); }
  catch (e) {
    console.error(e);
    html = '<main class="err-card"><h1 class="font-display">เนื้อหามีรูปแบบไม่ถูกต้อง</h1><p class="muted" style="margin-top:8px;font-size:14px">' + esc(e.message) + '</p><a class="btn-dark" href="#/admin">ไปแก้ที่หน้าจัดการเนื้อหา</a></main>';
  }
  if (html === '') return; // redirected
  document.getElementById('app').innerHTML = html;
  document.getElementById('prev-slot').innerHTML = S.preview ? '<div class="prev-bar"><span>กำลังดูตัวอย่างฉบับร่าง (ยังไม่เผยแพร่)</span><button type="button" data-act="exit-preview">ออกจากตัวอย่าง</button></div>' : '';
  document.title = r.t;
  if (changed || (opts && opts.top)) window.scrollTo(0, 0);
  lastPath = path;
}

/* ================= drawer ================= */
const NAV = [['/', 'หน้าแรก', 'Home'], ['/campaign', 'แคมเปญ', 'Campaign'], ['/scan', 'AI Executive Scan', 'Scan'], ['/benefits', 'สิทธิพิเศษ', 'Benefits'], ['/v-points', 'V Points', 'Points'], ['/member', 'สมาชิก Close Friends', 'Member'], ['/member/rewards', 'Rewards Catalog', 'Rewards']];
function buildDrawer() {
  document.getElementById('drawer').innerHTML =
    '<div class="drawer-top"><span class="t font-display">เมนู</span><button type="button" class="icon-btn" data-act="menu-close" aria-label="ปิดเมนู">' + ic('x') + '</button></div>' +
    '<label class="search">' + ic('search') + '<input id="nav-search" type="search" placeholder="ค้นหาหน้า" autocomplete="off"></label>' +
    '<nav class="dnav" id="dnav" aria-label="ทุกหน้า">' + NAV.map(n => '<a href="#' + n[0] + '" data-k="' + esc((n[1] + ' ' + n[2]).toLowerCase()) + '"><span>' + esc(n[1]) + '</span><small>' + esc(n[2]) + '</small></a>').join('') + '<p class="empty hidden" id="dnav-empty">ไม่พบหน้าที่ค้นหา</p></nav>' +
    '<a class="adm-link" href="#/admin">จัดการเนื้อหา (สำหรับผู้ดูแล)</a>';
}
function toggleDrawer(open, focusSearch) {
  const d = document.getElementById('drawer'), s = document.getElementById('scrim'); if (!d) return;
  d.classList.toggle('open', open); s.classList.toggle('open', open);
  d.setAttribute('aria-hidden', String(!open));
  if (open && focusSearch) setTimeout(() => { const i = document.getElementById('nav-search'); if (i) i.focus(); }, 280);
}

/* ================= scan logic ================= */
async function compressImage(file) {
  const bitmap = await createImageBitmap(file);
  const max = 900; const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale); canvas.height = Math.round(bitmap.height * scale);
  const ctx = canvas.getContext('2d'); if (!ctx) throw new Error('canvas unavailable');
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if (bitmap.close) bitmap.close();
  return canvas.toDataURL('image/jpeg', 0.82);
}
function startAnalysis() {
  const sc = content('scan'); const n = arr(sc.statusTexts).length;
  S.analyzing = true; S.statusIndex = 0; render();
  let i = 0; clearInterval(S.timer);
  S.timer = setInterval(() => {
    i += 1;
    if (i >= n) { clearInterval(S.timer); S.analyzing = false; S.step = 3; render(); return; }
    S.statusIndex = i;
    const el = document.getElementById('scan-status'); if (el) el.textContent = arr(sc.statusTexts)[i] || '';
  }, 1100);
}
async function share() {
  const sc = content('scan');
  const data = { title: 'SPACE V — Face Filter & Treatment', text: sc.resultTitle, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch (e) { /* cancelled */ } }
  else if (navigator.clipboard) { try { await navigator.clipboard.writeText(data.url); toast('คัดลอกลิงก์แล้ว'); } catch (e) { toast('คัดลอกลิงก์ไม่สำเร็จ'); } }
  else toast('อุปกรณ์นี้ยังไม่รองรับการแชร์');
}

/* ================= admin logic ================= */
function pushHistory(key, action) {
  CMS.history.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), key: key, action: action, by: (S.adminName || '').trim() || 'ผู้ดูแล', at: new Date().toISOString() });
  if (CMS.history.length > 200) CMS.history = CMS.history.slice(-200);
}
function admSave(publish) {
  const p = parseAdmin(S.adminText); if (p.err) return false;
  const k = S.adminTab; CMS.draft[k] = p.ok;
  if (publish) CMS.published[k] = p.ok;
  pushHistory(k, publish ? 'publish' : 'draft'); saveCms();
  S.adminNote = publish ? 'เผยแพร่เรียบร้อย' : 'บันทึกฉบับร่างเรียบร้อย';
  return true;
}
function refreshAdminHistory() {
  const ul = document.getElementById('adm-hist'); if (!ul) return;
  const hist = CMS.history.slice().reverse().slice(0, 30);
  ul.innerHTML = hist.length ? hist.map(h => '<li><span>' + esc(h.key) + ' · ' + (h.action === 'publish' ? 'เผยแพร่' : 'บันทึกร่าง') + ' · ' + esc(h.by) + '</span><span>' + esc(new Date(h.at).toLocaleString('th-TH')) + '</span></li>').join('') : '<li><span class="muted">ยังไม่มีประวัติ</span></li>';
  const n = document.getElementById('adm-note'); if (n) n.textContent = S.adminNote || '';
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.getAttribute('data-act');
  switch (a) {
    case 'menu': toggleDrawer(true); break;
    case 'search': toggleDrawer(true, true); break;
    case 'menu-close': toggleDrawer(false); break;
    case 'anchor': e.preventDefault(); toast(/contact/i.test(t.getAttribute('data-anchor')) ? 'ยังไม่ได้ตั้งลิงก์ปรึกษาแพทย์ — ใส่ลิงก์ LINE ใน consultUrl ที่หน้าจัดการเนื้อหา' : 'ยังไม่ได้ตั้งลิงก์ปลายทาง — แก้ได้ที่หน้าจัดการเนื้อหา'); break;
    case 'hero-prev': case 'hero-next': {
      const n = arr(content('site').heroSlides).length || 1;
      S.heroIdx = (S.heroIdx + (a === 'hero-next' ? 1 : n - 1)) % n; render(); break;
    }
    case 'cam': document.getElementById('in-cam').click(); break;
    case 'gallery': document.getElementById('in-gal').click(); break;
    case 'concern': { const id = t.getAttribute('data-id'); const i = S.concerns.indexOf(id); if (i > -1) S.concerns.splice(i, 1); else S.concerns.push(id); render(); break; }
    case 'analyze': if (S.concerns.length) startAnalysis(); break;
    case 'share': share(); break;
    case 'restart': resetScan(); render({ top: true }); break;
    case 'mode': S.mode = t.getAttribute('data-mode'); S.joinError = null; render(); break;
    case 'welcome-go': patchSession({ hasSeenWelcome: true }); render(); break;
    case 'signout': writeSession(null); location.hash = '#/member'; render(); break;
    case 'soon': toast('ฟีเจอร์นี้อยู่ระหว่างพัฒนา'); break;
    case 'rw-filter': S.rwFilter = t.getAttribute('data-c'); render(); break;
    case 'hub-filter': S.hubFilter = t.getAttribute('data-c'); render(); break;
    case 'redeem': {
      const r = REWARDS.find(x => x.id === t.getAttribute('data-id')); const s = readSession();
      if (r && s && s.points >= r.points) { patchSession({ points: Math.max(0, s.points - r.points) }); S.redeemed = r.id; render(); setTimeout(() => { S.redeemed = null; if (currentPath() === '/member/rewards') render(); }, 2500); }
      break;
    }
    case 'play': { const id = t.getAttribute('data-id'); S.playing = id; render(); setTimeout(() => { if (S.playing === id) { S.playing = null; if (currentPath() === '/member/content') render(); } }, 1600); break; }
    case 'exit-preview': S.preview = false; render(); break;
    case 'adm-tab': S.adminTab = t.getAttribute('data-tab'); S.adminText = null; S.adminNote = null; render(); break;
    case 'adm-draft': if (admSave(false)) refreshAdminHistory(); break;
    case 'adm-publish': if (admSave(true)) refreshAdminHistory(); break;
    case 'adm-preview': if (admSave(false)) { S.preview = true; location.hash = '#/'; render({ top: true }); } break;
    case 'adm-reset': S.adminText = JSON.stringify(DEFAULT[S.adminTab], null, 2); S.adminNote = 'โหลดค่าเริ่มต้นแล้ว — กดบันทึกหรือเผยแพร่เพื่อใช้งาน'; render(); break;
    case 'adm-export': {
      const out = { site: CMS.published.site || DEFAULT.site, scan: CMS.published.scan || DEFAULT.scan };
      try {
        const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'space-v-content.json';
        document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        S.adminNote = 'ส่งออกเนื้อหาที่เผยแพร่แล้ว'; refreshAdminHistory();
      } catch (err) { toast('ส่งออกไม่สำเร็จในเบราว์เซอร์นี้'); }
      break;
    }
  }
});
document.addEventListener('click', function (e) { if (e.target.id === 'scrim') toggleDrawer(false); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggleDrawer(false); });

document.addEventListener('change', async function (e) {
  if (!e.target.classList.contains('file-in')) return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { S.photo = await compressImage(f); S.step = 2; render({ top: true }); }
  catch (err) { S.photo = null; toast('เปิดรูปไม่สำเร็จ ลองเลือกรูปอื่น'); }
  e.target.value = '';
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'join-form') return;
  e.preventDefault();
  const f = new FormData(e.target); const phone = String(f.get('phone') || '').trim(); const pw = String(f.get('password') || '');
  const err = document.getElementById('join-err');
  let msg = null;
  if (!/^0\d{8,9}$/.test(phone)) msg = 'กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง';
  else if (pw.length < 6) msg = 'รหัสผ่านอย่างน้อย 6 ตัวอักษร';
  if (msg) { S.joinError = msg; err.textContent = msg; err.classList.remove('hidden'); return; }
  S.joinError = null;
  joinOrSignIn(phone, S.mode === 'join' ? String(f.get('name') || '') : '');
  render({ top: true });
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'adm-text') {
    S.adminText = e.target.value; const p = parseAdmin(S.adminText);
    const err = document.getElementById('adm-err'); err.textContent = 'รูปแบบข้อมูลไม่ถูกต้อง: ' + (p.err || ''); err.classList.toggle('hidden', !p.err);
    ['b-prev', 'b-draft', 'b-pub'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = !!p.err; });
    S.adminNote = null; const n = document.getElementById('adm-note'); if (n) n.textContent = '';
  } else if (e.target.id === 'adm-name') {
    S.adminName = e.target.value; store.set('sv_admin_name', S.adminName);
  } else if (e.target.id === 'nav-search') {
    const q = e.target.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll('#dnav a').forEach(a => { const ok = !q || a.getAttribute('data-k').indexOf(q) > -1; a.classList.toggle('hidden', !ok); if (ok) shown++; });
    document.getElementById('dnav-empty').classList.toggle('hidden', shown > 0);
  }
});
window.addEventListener('hashchange', function () { render(); });

buildDrawer();
render();
})();

</script>
